# chargehand role: pr-reviewer
#
# A worker in this role reviews a pull request you were asked to review and answers
# replies on its own comments. It starts from events of the `github` source, so the
# machine configuration needs a `[[source]]` of type "github", and the repository needs
# its `github = "owner/repo"` key. `chargehand init --role pr-reviewer` writes this file
# and the agent file it names, .claude/agents/pr-reviewer.md.

# The agent file holds the reviewer's instructions. Claude Code looks for it in the
# session's working directory, a fresh checkout of `base`, and then in ~/.claude/agents.
# So commit it to the base branch, or copy it to ~/.claude/agents.
agent = "pr-reviewer"
# model = "opus"
# effort = "high"

# Workers post as you. The marker at the end tells chargehand that a comment is the
# worker's own, so it does not wake the worker. It is in the prompt as well as in the
# agent file, so a missing agent file does not let the reviewer wake itself.
# When chargehand wakes the worker, each line of its message is an event kind, a colon
# and a link; the prompt says what each kind asks for, for the same reason.
# The worker posts each body from a file, because a launch deny rule matches the whole
# command text: a review of a change that names a denied word would be refused on the
# command line. The file's content never reaches the rules. This is in both files too.
prompt = "Review the pull request {item_url}. Its head is checked out at {item_checkout}; read the code there. When you are woken later, each line names an event kind and a link: review_requested asks you to review the pull request again; comment, review and mention are new comments or replies to answer when they need it; ci_status is a CI result to check; pr_closed means the pull request is closed or merged, so post nothing more. Never put a body on a command line: write it with the Write tool, not a shell command, to a new file under /tmp/gh-body/ that ends with the marker named next, then post the file with --body-file (gh pr comment, gh pr review --comment) or -F body=@<file> (gh api). End every comment, review and reply you post with <!-- chargehand-worker -->"
permission_mode = "auto"
# Read the pull request, write body files to /tmp/gh-body/ and post them as comments
# without a prompt. Everything else, `gh api` included, goes to the auto-mode classifier
# or a permission prompt: `gh api` can approve or merge as easily as it can read. A
# reply in a review thread goes through `gh api` too, and has no rule of its own: a `*`
# also matches spaces, so a rule for the reply endpoint would also match a call that
# merges the pull request with that text in an argument. A pattern matches the command
# text, so this list is a guardrail, not a boundary.
# The body directory is outside every checkout, so a body file cannot be committed and
# does not make a checkout dirty. An Edit rule covers the Write tool too, and `//` starts
# an absolute path; /tmp is /private/tmp on macOS, so both spellings are listed.
allow = [
  "Bash(gh pr view *)",
  "Bash(gh pr diff *)",
  "Bash(gh pr checks *)",
  "Bash(gh pr comment *--body-file *)",
  "Bash(gh pr review * --comment --body-file *)",
  "Edit(//tmp/gh-body/**)",
  "Edit(//private/tmp/gh-body/**)",
]

# The session works in a fresh checkout of `base`, which is yours. The pull request head
# is the author's content: Claude Code would load its settings, hooks, MCP servers and
# CLAUDE.md from a working directory, so the head goes into a separate checkout that the
# session only reads, {item_checkout}. This setup step runs there, without a shell, at
# the launch and again before each wake, so the checkout follows the pull request head.
# It checks the head out detached, so git does not refuse a branch that is checked out in
# another worktree.
checkout = "item"
setup = "gh pr checkout {item_url} --detach"

# Start a reviewer when you are asked to review a pull request and no reviewer has it
# yet. A second request for the same pull request wakes the reviewer that has it.
[[start]]
on = "github.review_requested"
unless_subscribed = "role"
# The events on the pull request that wake the worker, and the ones that end it. A
# closed or merged pull request ends the worker once its turn is over; garbage
# collection then removes its session and both checkouts, never over unpushed commits.
subscribe = ["comment", "review", "ci_status"]
close_on = ["pr_closed"]

[policy]
max_workers = 4
# A comment without the marker wakes the worker once. This cap stops a loop.
max_wakes_per_day = 12
debounce_secs = 120
