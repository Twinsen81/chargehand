# chargehand role: pr-reviewer
#
# A worker in this role reviews a pull request you were asked to review and answers
# replies on its own comments. It starts from events of the `github` source, so the
# machine configuration needs a `[[source]]` of type "github", and the repository needs
# its `github = "owner/repo"` key. `chargehand init --role pr-reviewer` writes this file
# and the agent file it names, .claude/agents/pr-reviewer.md.

# The agent file holds the reviewer's instructions. Claude Code looks for it in the
# session's working directory, a fresh checkout of `base`, and then in ~/.claude/agents.
# So commit it to the base branch, or copy it to ~/.claude/agents.
agent = "pr-reviewer"
# model = "opus"
# effort = "high"

# Workers post as you. The marker at the end tells chargehand that a comment is the
# worker's own, so it does not wake the worker. It is in the prompt as well as in the
# agent file, so a missing agent file does not let the reviewer wake itself.
prompt = "Review the pull request {item_url}. Its head is checked out at {item_checkout}; read the code there. End every comment, review and reply you post with <!-- chargehand -->"
permission_mode = "auto"
# Read the pull request and comment on it. Not merge, close or approve: those are left to
# the auto-mode classifier or a permission prompt. A pattern matches the command text, so
# this list is a guardrail, not a boundary.
allow = [
  "Bash(gh pr view *)",
  "Bash(gh pr diff *)",
  "Bash(gh pr checks *)",
  "Bash(gh pr comment *)",
  "Bash(gh pr review * --comment *)",
  "Bash(gh api repos/*/pulls/*/comments*)",
  "Bash(gh api repos/*/pulls/*/reviews*)",
  "Bash(gh api repos/*/issues/*/comments*)",
]

# The session works in a fresh checkout of `base`, which is yours. The pull request head
# is the author's content: Claude Code would load its settings, hooks, MCP servers and
# CLAUDE.md from a working directory, so the head goes into a separate checkout that the
# session only reads, {item_checkout}. This setup step runs there, without a shell, and
# checks the head out detached, so git does not refuse a branch that is checked out in
# another worktree.
checkout = "item"
setup = "gh pr checkout {item_url} --detach"

# Start a reviewer when you are asked to review a pull request and no reviewer has it
# yet. A second request for the same pull request wakes the reviewer that has it.
[[start]]
on = "github.review_requested"
unless_subscribed = "role"
# The events on the pull request that wake the worker, and the ones that end it. A
# closed or merged pull request ends the worker once its turn is over; garbage
# collection then removes its session and both checkouts, never over unpushed commits.
subscribe = ["comment", "review", "ci_status"]
close_on = ["pr_closed"]

[policy]
max_workers = 4
# A comment without the marker wakes the worker once. This cap stops a loop.
max_wakes_per_day = 12
debounce_secs = 120
