# chargehand — machine configuration
#
# Everything specific to this machine lives here. Nothing in this file belongs in a
# repository: a repository contributes only its own .chargehand.toml and role files.
#
# Copy to ~/.config/chargehand/config.toml and edit.

poll_interval_secs = 180

# Launch throttle: how many workers may be actively working at once. Blocked workers
# do not hold a slot, because one waiting overnight for an answer would otherwise stall
# the queue.
max_concurrent = 2

# Working + blocked. Bounds how many sessions can wake at once when you answer a batch
# of questions.
max_open_workers = 4

# Watchdog. Background sessions have no spend cap, so the limits are wall-clock.
max_run_hours = 6
hard_stop_hours = 10

worktree_root = "~/chargehand-worktrees"

# Warn when the worktree root's filesystem drops below this.
min_free_disk_gb = 30

# The daemon, `chargehand serve`, which `chargehand install` sets up as a launchd job. It
# listens on 127.0.0.1 only; nothing here binds another address. Mutating requests need
# the token in token_file, which the daemon writes with mode 0600 when it is missing.
# poll_interval_secs above is now only the refresh interval of `chargehand watch`.
[serve]
port = 7878
# token_file = "~/.config/chargehand/board.token"   # the default: next to this file
tick_interval_secs = 60

[notify]
# Receives CHARGEHAND_ITEM, CHARGEHAND_ROLE, CHARGEHAND_STATE, CHARGEHAND_URL,
# CHARGEHAND_REPOSITORY and CHARGEHAND_DETAIL as environment variables (CHARGEHAND_ISSUE and
# CHARGEHAND_ROUTE stay set with the same values). The payload carries no issue text and no
# agent output, because it usually crosses a third-party relay.
command = "~/.config/chargehand/notify.sh"

# Queue labels. These are the default names; change them to match your tracker.
[labels]
queued = "chargehand"
running = "chargehand-running"
blocked = "chargehand-blocked"

[[repository]]
name = "my-app"
path = "~/code/my-app"
tracker = { type = "linear", team = "ABC", state = "Todo" }
# The roles enabled in this repository. Each one is a file under
# <repo>/.chargehand/roles/ or ~/.config/chargehand/roles/.
roles = ["implementer"]
# Optional per-repository cap, applied on top of the global max_concurrent.
# max_concurrent = 1

# The Linear API key is read from $CHARGEHAND_LINEAR_API_KEY, then from an optional
# api_key_command, then from the login keychain:
#
#   security add-generic-password -s chargehand-linear -a "$USER" -w 'lin_api_...'
