# chargehand — repository configuration
#
# Checked in. Holds what the repository owns; machine details stay in
# ~/.config/chargehand/config.toml, and how a worker thinks and when it runs is a
# role file under .chargehand/roles/.

# The branch each worker starts from.
base = "origin/main"

# Optional. Run in the fresh worktree after it is created and before the session
# starts. A non-zero exit fails the launch loudly rather than starting a session in a
# half-prepared tree. A role may add its own `setup`, which runs after this one.
#
# Available variables: {item} {item_url} {worktree} {branch} {repo}
# setup = "scripts/setup_worktree.sh {worktree}"

# Placeholder branch each worker starts on: <prefix><role>/<item>. Whatever the
# prompt runs may rename it.
branch_prefix = "chargehand/"

# `prompt`, `permission_mode` and `status_file` used to live here. A repository that
# still has them and no .chargehand/roles/implementer.toml gets its `implementer`
# role from them, so an older configuration keeps working.
